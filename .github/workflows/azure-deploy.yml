name: Azure Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ 'Smoke Test' ]
    branches: [ main ]
    types: [ completed ]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: azure-production
  cancel-in-progress: true

env:
  API_IMAGE: ghcr.io/raulgonzaleza/swgoh-api
  BLAZOR_IMAGE: ghcr.io/raulgonzaleza/swgoh-blazor
  AZURE_RESOURCE_GROUP: rg-swgoh-prod
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    name: Publish container images
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.Api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ env.DEPLOY_SHA }}
            ${{ env.API_IMAGE }}:main
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
          secrets: |
            nuget_pat=${{ secrets.NUGET_PAT }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Blazor
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.Blazor
          push: true
          tags: |
            ${{ env.BLAZOR_IMAGE }}:${{ env.DEPLOY_SHA }}
            ${{ env.BLAZOR_IMAGE }}:main
          cache-from: type=gha,scope=blazor
          cache-to: type=gha,mode=max,scope=blazor

  deploy:
    name: Deploy to Azure Container Apps
    needs: publish
    if: ${{ vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API revision
        run: >-
          az containerapp update
          --name swgoh-api
          --resource-group "${AZURE_RESOURCE_GROUP}"
          --image "${API_IMAGE}:${DEPLOY_SHA}"
          --output none

      - name: Deploy Blazor revision
        run: >-
          az containerapp update
          --name swgoh-blazor
          --resource-group "${AZURE_RESOURCE_GROUP}"
          --image "${BLAZOR_IMAGE}:${DEPLOY_SHA}"
          --output none
