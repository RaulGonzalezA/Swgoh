name: GAC Full Scan
run-name: GAC Full Scan · ally ${{ inputs.ally_code || '476825771' }}

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/gac-full-scan.yml
  workflow_dispatch:
    inputs:
      ally_code:
        description: SWGOH ally code to diagnose
        required: true
        default: '476825771'
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: gac-full-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  SWGOH_TEST_ALLY_CODE: ${{ inputs.ally_code || '476825771' }}

jobs:
  scan:
    name: Exhaustive live GAC bracket scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start Comlink
        run: |
          set -euo pipefail
          docker run -d --name comlink -p 3000:3000 \
            -e APP_NAME=swgoh-gac-full-scan \
            -e PORT=3000 \
            ghcr.io/swgoh-utils/swgoh-comlink:latest

          for attempt in {1..60}; do
            if curl --silent --show-error --output /dev/null http://127.0.0.1:3000/; then
              exit 0
            fi
            sleep 2
          done

          docker logs comlink || true
          exit 1

      - name: Scan active GAC instance
        env:
          COMLINK_URL: http://127.0.0.1:3000
          MAX_BRACKET_INDEX: '20000'
          WORKERS: '32'
        run: |
          set -euo pipefail
          mkdir -p gac-full-scan

          python3 - <<'PY'
          import concurrent.futures
          import json
          import os
          import pathlib
          import time
          import urllib.error
          import urllib.request
          from collections import Counter

          base_url = os.environ["COMLINK_URL"].rstrip("/")
          ally_code = str(os.environ["SWGOH_TEST_ALLY_CODE"])
          max_index = int(os.environ["MAX_BRACKET_INDEX"])
          workers = int(os.environ["WORKERS"])
          output = pathlib.Path("gac-full-scan")

          def post(path, payload):
              request = urllib.request.Request(
                  f"{base_url}/{path}",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read().decode("utf-8")
                      return response.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as error:
                  raw = error.read().decode("utf-8")
                  try:
                      value = json.loads(raw) if raw else {}
                  except json.JSONDecodeError:
                      value = {"raw": raw}
                  return error.code, value
              except (urllib.error.URLError, TimeoutError) as error:
                  return 0, {"error": str(error)}

          def save(name, value):
              (output / name).write_text(
                  json.dumps(value, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )

          player_status, player = post(
              "playerArena",
              {
                  "payload": {"allyCode": ally_code, "playerDetailsOnly": True},
                  "enums": False,
              },
          )
          events_status, events = post("getEvents", {"payload": {}, "enums": False})
          save("player-arena.json", player)
          save("events.json", events)

          if player_status != 200 or events_status != 200:
              raise SystemExit(
                  f"Unable to load live context: playerArena={player_status}, getEvents={events_status}"
              )

          player_id = player.get("playerId") or player.get("id")
          rating = player.get("playerRating") or {}
          rank_status = rating.get("playerRankStatus") or {}
          league_id = rank_status.get("leagueId") or rating.get("league") or "KYBER"
          division_id = rank_status.get("divisionId") or rating.get("division")
          league_lower = str(league_id).lower()

          now_ms = int(time.time() * 1000)
          gac_instances = []
          for event in events.get("gameEvent") or []:
              if not isinstance(event, dict) or str(event.get("type")) != "10":
                  continue
              event_id = event.get("id")
              for instance in event.get("instance") or []:
                  if not isinstance(instance, dict) or not event_id or instance.get("id") is None:
                      continue
                  try:
                      start_ms = int(instance.get("startTime") or 0)
                      end_ms = int(instance.get("endTime") or 0)
                  except (TypeError, ValueError):
                      start_ms = 0
                      end_ms = 0
                  gac_instances.append({
                      "eventId": event_id,
                      "instanceId": instance.get("id"),
                      "eventInstanceId": f"{event_id}:{instance.get('id')}",
                      "startTime": start_ms,
                      "endTime": end_ms,
                      "activeNow": start_ms <= now_ms <= end_ms if start_ms and end_ms else False,
                      "status": event.get("status"),
                      "seasonDefId": event.get("seasonDefId"),
                  })

          active_instances = [value for value in gac_instances if value["activeNow"]]
          if not active_instances:
              raise SystemExit("No active GAC event instance is exposed by Comlink.")

          active = active_instances[0]
          event_instance_id = active["eventInstanceId"]

          def bracket_request(token, index):
              group_id = f"{event_instance_id}:{token}:{index}"
              status, response = post(
                  "getLeaderboard",
                  {
                      "payload": {
                          "leaderboardType": 4,
                          "eventInstanceId": event_instance_id,
                          "groupId": group_id,
                      },
                      "enums": False,
                  },
              )
              players = response.get("player") if isinstance(response, dict) else None
              if not isinstance(players, list):
                  players = []
              return index, group_id, status, players

          def summarize_participant(value):
              if not isinstance(value, dict):
                  return {}
              return {
                  "id": value.get("id"),
                  "playerId": value.get("playerId"),
                  "allyCode": value.get("allyCode"),
                  "name": value.get("name"),
              }

          def is_self(value):
              if not isinstance(value, dict):
                  return False
              candidate_id = value.get("id") or value.get("playerId")
              if player_id and candidate_id == player_id:
                  return True
              candidate_ally = value.get("allyCode")
              return candidate_ally is not None and str(candidate_ally) == ally_code

          def scan_token(token):
              status_counts = Counter()
              non_empty_count = 0
              first_non_empty = None
              last_non_empty = None
              sample_brackets = []
              found = None
              batch_size = 128

              with concurrent.futures.ThreadPoolExecutor(max_workers=workers) as executor:
                  for start in range(0, max_index + 1, batch_size):
                      end = min(start + batch_size - 1, max_index)
                      futures = [
                          executor.submit(bracket_request, token, index)
                          for index in range(start, end + 1)
                      ]
                      batch = [future.result() for future in concurrent.futures.as_completed(futures)]
                      batch.sort(key=lambda item: item[0])

                      for index, group_id, status, players in batch:
                          status_counts[str(status)] += 1
                          if players:
                              non_empty_count += 1
                              if first_non_empty is None:
                                  first_non_empty = index
                              last_non_empty = index
                              if len(sample_brackets) < 3:
                                  sample_brackets.append({
                                      "index": index,
                                      "groupId": group_id,
                                      "playerCount": len(players),
                                      "participants": [summarize_participant(value) for value in players],
                                  })

                          for player_index, participant in enumerate(players):
                              if not is_self(participant):
                                  continue
                              found = {
                                  "bracketIndex": index,
                                  "groupId": group_id,
                                  "playerIndex": player_index,
                                  "aboveApplicationLimit": index > 8191,
                                  "participants": [summarize_participant(value) for value in players],
                              }
                              break

                          if found is not None:
                              break

                      if found is not None:
                          break

                      if end % 1024 < batch_size:
                          print(
                              f"token={token} scannedThrough={end} nonEmpty={non_empty_count}",
                              flush=True,
                          )

              return {
                  "token": token,
                  "found": found is not None,
                  "match": found,
                  "scannedThrough": found["bracketIndex"] if found else max_index,
                  "statusCounts": dict(status_counts),
                  "nonEmptyBracketCount": non_empty_count,
                  "firstNonEmptyIndex": first_non_empty,
                  "lastNonEmptyIndex": last_non_empty,
                  "sampleBrackets": sample_brackets,
              }

          tokens = [league_lower]
          upper = str(league_id).upper()
          if upper not in tokens:
              tokens.append(upper)

          scans = []
          for token in tokens:
              scan = scan_token(token)
              scans.append(scan)
              if scan["found"]:
                  break

          result = {
              "requestedAllyCode": ally_code,
              "player": {
                  "allyCode": player.get("allyCode"),
                  "playerId": player_id,
                  "name": player.get("name"),
                  "skillRating": (rating.get("playerSkillRating") or {}).get("skillRating"),
                  "leagueId": league_id,
                  "divisionId": division_id,
              },
              "applicationMaxBracketIndex": 8191,
              "diagnosticMaxBracketIndex": max_index,
              "activeEventInstance": active,
              "allGacInstances": gac_instances,
              "scans": scans,
              "found": any(scan["found"] for scan in scans),
          }
          save("result.json", result)
          print(json.dumps(result, indent=2, ensure_ascii=False))
          PY

      - name: Upload full scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gac-full-scan-${{ github.run_number }}
          path: gac-full-scan/
          if-no-files-found: warn
          retention-days: 7

      - name: Dump Comlink logs on failure
        if: failure()
        run: docker logs comlink || true

      - name: Cleanup
        if: always()
        run: docker rm -f comlink 2>/dev/null || true
