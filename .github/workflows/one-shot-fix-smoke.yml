name: One-shot smoke fix

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Add one-shot smoke workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply and clean up
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/smoke-test.yml')
          text = p.read_text()
          old = 'dotnet run --project src/Swgoh.Api/Swgoh.Api.csproj --configuration Release --no-build --no-restore > smoke-results/api.log 2>&1 &'
          new = 'dotnet run --project src/Swgoh.Api/Swgoh.Api.csproj --configuration Release --no-build --no-restore --no-launch-profile > smoke-results/api.log 2>&1 &'
          if old not in text:
              raise SystemExit('Smoke start command not found')
          p.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/_tmp_smoke_test_patch_marker.txt
          rm -f scripts/patch-smoke.sh
          rm -f .github/workflows/one-shot-fix-smoke.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix smoke API launch profile'
          git push
