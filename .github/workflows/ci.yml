name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_smoke:
        description: Run Smoke Test after CI succeeds
        required: true
        default: true
        type: boolean
      ally_code:
        description: SWGOH ally code used when Smoke Test is requested
        required: false
        default: '476825771'
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  validate:
    name: Format, build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Authenticate GitHub Packages
        run: >-
          dotnet nuget update source github-rga
          --username "${{ github.actor }}"
          --password "${{ github.token }}"
          --store-password-in-clear-text
          --configfile NuGet.config

      - name: Restore
        run: dotnet restore Swgoh.sln

      - name: Verify formatting
        run: dotnet format Swgoh.sln --verify-no-changes --no-restore

      - name: Build Release
        run: dotnet build Swgoh.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Swgoh.sln --configuration Release --no-build --no-restore

  dispatch-smoke:
    name: Trigger Smoke Test
    needs: validate
    if: >-
      needs.validate.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_smoke
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      SMOKE_REF: ${{ github.ref_name }}
      SMOKE_ALLY_CODE: ${{ inputs.ally_code || '476825771' }}
    steps:
      - name: Dispatch Smoke Test
        run: >-
          gh workflow run smoke-test.yml
          --repo "${{ github.repository }}"
          --ref "${SMOKE_REF}"
          -f ally_code="${SMOKE_ALLY_CODE}"
