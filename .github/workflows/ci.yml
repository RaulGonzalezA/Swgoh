name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  validate:
    name: Format, build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Authenticate GitHub Packages
        run: >
          dotnet nuget update source github
          --configfile NuGet.config
          --username "${{ github.actor }}"
          --password "${{ secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text

      - name: Restore
        run: dotnet restore Swgoh.sln

      - name: Verify formatting
        run: dotnet format Swgoh.sln --verify-no-changes --no-restore

      - name: Build Release
        run: dotnet build Swgoh.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Swgoh.sln --configuration Release --no-build --no-restore
