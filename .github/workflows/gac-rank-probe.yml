name: GAC Rank Probe
on:
  push:
    branches: [ main ]
    paths: [ .github/workflows/gac-rank-probe.yml ]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Start Comlink
        run: |
          docker run -d --name comlink -p 3000:3000 -e APP_NAME=gac-rank-probe -e PORT=3000 ghcr.io/swgoh-utils/swgoh-comlink:latest
          for i in {1..60}; do curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0 || true; sleep 2; done
          exit 1
      - name: Locate bracket near rating
        run: |
          python3 - <<'PY'
          import concurrent.futures,json,time,urllib.request,urllib.error
          BASE='http://127.0.0.1:3000'; ALLY='476825771'
          def post(path,payload):
            req=urllib.request.Request(BASE+'/'+path,data=json.dumps({'payload':payload,'enums':False}).encode(),headers={'Content-Type':'application/json'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=20) as r:return r.status,json.load(r)
            except urllib.error.HTTPError as e:
              try:return e.code,json.loads(e.read().decode())
              except:return e.code,{}
          def players(v):
            if not isinstance(v,dict):return []
            p=v.get('player')
            if isinstance(p,list) and p:return p
            lbs=v.get('leaderboard'); lbs=[lbs] if isinstance(lbs,dict) else (lbs or [])
            for lb in lbs:
              p=lb.get('player') if isinstance(lb,dict) else None
              if isinstance(p,list) and p:return p
            return []
          _,me=post('player',{'allyCode':ALLY}); _,events=post('getEvents',{}); now=int(time.time()*1000); pid=me.get('playerId')
          event_instance=None
          for e in events.get('gameEvent') or []:
            if str(e.get('type'))!='10':continue
            for i in e.get('instance') or []:
              if int(i.get('startTime') or 0)<=now<=int(i.get('endTime') or 0):event_instance=f"{e['id']}:{i['id']}";break
            if event_instance:break
          def check(index):
            gid=f'{event_instance}:KYBER:{index}'; status,value=post('getLeaderboard',{'leaderboardType':4,'eventInstanceId':event_instance,'groupId':gid}); ps=players(value)
            return index,status,ps
          checked=0
          for start in range(4050,4351,8):
            indexes=list(range(start,min(start+8,4351)))
            with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex: batch=list(ex.map(check,indexes))
            checked+=len(batch)
            for index,status,ps in batch:
              if any((p.get('id') or p.get('playerId'))==pid or str(p.get('allyCode') or '')==ALLY for p in ps):
                print(json.dumps({'FOUND':True,'index':index,'requests':checked,'rating':((me.get('playerRating') or {}).get('playerSkillRating') or {}).get('skillRating'),'groupId':f'{event_instance}:KYBER:{index}','players':ps},indent=2));raise SystemExit(0)
            time.sleep(.35)
          print(json.dumps({'FOUND':False,'requests':checked}))
          PY
      - name: Cleanup
        if: always()
        run: docker rm -f comlink 2>/dev/null || true
