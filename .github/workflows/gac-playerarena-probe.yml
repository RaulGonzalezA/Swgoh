name: GAC PlayerArena Probe
on:
  push:
    branches: [ main ]
    paths: [ .github/workflows/gac-playerarena-probe.yml ]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Start Comlink
        run: |
          docker run -d --name comlink -p 3000:3000 -e APP_NAME=swgoh-playerarena-probe -e PORT=3000 ghcr.io/swgoh-utils/swgoh-comlink:latest
          for i in {1..60}; do curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0 || true; sleep 2; done
          exit 1
      - name: Inspect PVP profile
        run: |
          python3 - <<'PY'
          import json,urllib.request
          def post(path,payload):
            req=urllib.request.Request('http://127.0.0.1:3000/'+path,data=json.dumps({'payload':payload,'enums':False}).encode(),headers={'Content-Type':'application/json'},method='POST')
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          arena=post('playerArena',{'allyCode':'476825771','playerDetailsOnly':True})
          player=post('player',{'allyCode':'476825771'})
          print(json.dumps({'arenaPvpProfile':arena.get('pvpProfile'),'playerPvpProfile':player.get('pvpProfile'),'seasonStatus':player.get('seasonStatus'),'playerRating':player.get('playerRating')},indent=2))
          PY
      - name: Cleanup
        if: always()
        run: docker rm -f comlink 2>/dev/null || true
