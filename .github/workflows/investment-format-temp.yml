name: Temporary Investment Format

on:
  push:
    branches: [ feat/investment-real-inventory ]

permissions:
  contents: read
  packages: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/investment-real-inventory

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Authenticate GitHub Packages
        run: >-
          dotnet nuget update source github-rga
          --username "${{ github.actor }}"
          --password "${{ secrets.NUGET_PAT }}"
          --store-password-in-clear-text
          --configfile NuGet.config

      - name: Restore
        run: dotnet restore Swgoh.sln

      - name: Restore NuGet config before diagnostics
        run: git checkout -- NuGet.config

      - name: Capture format diagnostics
        shell: bash
        run: |
          set +e
          dotnet format Swgoh.sln --verify-no-changes --no-restore --verbosity diagnostic > format-diagnostics.log 2>&1
          echo $? > format-exit-code.txt
          exit 0

      - name: Upload format diagnostics
        uses: actions/upload-artifact@v6
        with:
          name: investment-format-diagnostics
          path: |
            format-diagnostics.log
            format-exit-code.txt
          if-no-files-found: error
