name: Temporary Investment Format

on:
  push:
    branches: [ feat/investment-real-inventory ]

permissions:
  contents: read
  packages: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/investment-real-inventory

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Authenticate GitHub Packages
        run: >-
          dotnet nuget update source github-rga
          --username "${{ github.actor }}"
          --password "${{ secrets.NUGET_PAT }}"
          --store-password-in-clear-text
          --configfile NuGet.config

      - name: Restore
        run: dotnet restore Swgoh.sln

      - name: Format
        run: dotnet format Swgoh.sln --no-restore

      - name: Export formatting patch
        run: git diff --binary > investment-format.patch

      - name: Upload formatting patch
        uses: actions/upload-artifact@v6
        with:
          name: investment-format-patch
          path: investment-format.patch
          if-no-files-found: error
