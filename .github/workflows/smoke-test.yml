name: Smoke Test
run-name: Smoke Test · ally ${{ inputs.ally_code || '476825771' }}

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ally_code:
        description: SWGOH ally code for the live smoke test
        required: true
        default: '476825771'
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: smoke-test-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true
  SWGOH_TEST_ALLY_CODE: ${{ inputs.ally_code || '476825771' }}

jobs:
  smoke:
    name: Live player smoke test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        vars.RUN_SMOKE_AFTER_CI != 'false'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Authenticate GitHub Packages
        run: >-
          dotnet nuget update source github-rga
          --username "${{ github.actor }}"
          --password "${{ github.token }}"
          --store-password-in-clear-text
          --configfile NuGet.config

      - name: Restore
        run: dotnet restore Swgoh.sln

      - name: Build API
        run: dotnet build src/Swgoh.Api/Swgoh.Api.csproj --configuration Release --no-restore

      - name: Start live smoke dependencies
        run: |
          set -euo pipefail

          docker network create swgoh-smoke
          docker run -d --name mongodb --network swgoh-smoke -p 27017:27017 mongo:8
          docker run -d --name comlink --network swgoh-smoke -p 3000:3000 \
            -e APP_NAME=swgoh \
            -e PORT=3000 \
            ghcr.io/swgoh-utils/swgoh-comlink:latest

          comlink_ready=false
          for attempt in {1..60}; do
            if curl --silent --show-error --output /dev/null http://127.0.0.1:3000/; then
              comlink_ready=true
              break
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx comlink; then
              echo 'Comlink stopped during startup.'
              docker logs comlink || true
              exit 1
            fi
            sleep 2
          done

          if [[ "${comlink_ready}" != true ]]; then
            echo 'Comlink did not become ready in time.'
            docker logs comlink || true
            exit 1
          fi

          docker run -d --name swgoh-stats --network swgoh-smoke -p 3223:3223 \
            -e PORT=3223 \
            -e CLIENT_URL=http://comlink:3000 \
            ghcr.io/swgoh-utils/swgoh-stats:latest

          stats_ready=false
          for attempt in {1..90}; do
            if docker logs swgoh-stats 2>&1 | grep -q 'Data updates complete!'; then
              stats_ready=true
              break
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx swgoh-stats; then
              echo 'swgoh-stats stopped during startup.'
              docker logs swgoh-stats || true
              exit 1
            fi
            sleep 2
          done

          if [[ "${stats_ready}" != true ]]; then
            echo 'swgoh-stats did not finish loading game data in time.'
            docker logs swgoh-stats || true
            exit 1
          fi

      - name: Start API
        env:
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ConnectionStrings__swgoh: mongodb://127.0.0.1:27017/swgoh
          Swgoh__Comlink__BaseUrl: http://127.0.0.1:3000
          Swgoh__Stats__BaseUrl: http://127.0.0.1:3223
        run: |
          mkdir -p smoke-results
          dotnet run --project src/Swgoh.Api/Swgoh.Api.csproj --configuration Release --no-build --no-restore > smoke-results/api.log 2>&1 &
          echo $! > smoke-results/api.pid

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5080/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          cat smoke-results/api.log
          exit 1

      - name: Execute live player smoke test
        run: |
          set -euo pipefail
          api_root="http://127.0.0.1:5080"
          base_url="${api_root}/api/v1/players/${SWGOH_TEST_ALLY_CODE}"
          gac_opponent_url="${api_root}/api/v1/gac/opponents/${SWGOH_TEST_ALLY_CODE}"
          current_gac_url="${api_root}/api/v1/gac/players/${SWGOH_TEST_ALLY_CODE}/current-opponent/scouting"

          curl --fail-with-body --silent --show-error "${api_root}/openapi/v1.json" --output smoke-results/openapi-v1.json
          curl --fail-with-body --silent --show-error "${api_root}/scalar" --output smoke-results/scalar.html
          jq -e '.paths | length > 0' smoke-results/openapi-v1.json > /dev/null
          jq -e '.paths | has("/api/v1/players/{allyCode}/roster")' smoke-results/openapi-v1.json > /dev/null
          jq -e '.paths | has("/api/v1/squads")' smoke-results/openapi-v1.json > /dev/null
          jq -e '.paths | has("/api/v1/squads/{id}")' smoke-results/openapi-v1.json > /dev/null
          jq -e '.paths | has("/api/v1/gac/defense-requirements")' smoke-results/openapi-v1.json > /dev/null
          jq -e '.paths | has("/api/v1/gac/defense-requirements/transition")' smoke-results/openapi-v1.json > /dev/null
          jq -e '.paths | has("/api/v1/gac/players/{allyCode}/current-opponent/scouting")' smoke-results/openapi-v1.json > /dev/null
          jq -e '.paths | has("/api/v1/gac/opponents/{allyCode}/history")' smoke-results/openapi-v1.json > /dev/null
          jq -e '.paths | has("/api/v1/gac/opponents/{allyCode}/scouting")' smoke-results/openapi-v1.json > /dev/null

          curl --fail-with-body --silent --show-error \
            "${api_root}/api/v1/gac/defense-requirements?league=Kyber&format=5v5" \
            --output smoke-results/gac-requirements.json
          curl --fail-with-body --silent --show-error \
            "${api_root}/api/v1/gac/defense-requirements/transition?fromLeague=Aurodium&toLeague=Kyber&format=3v3" \
            --output smoke-results/gac-transition.json

          current_gac_status=$(curl --silent --show-error \
            "${current_gac_url}?maxRounds=10" \
            --output smoke-results/current-gac.json \
            --write-out '%{http_code}')
          case "${current_gac_status}" in
            200)
              jq -e '.opponent.playerAllyCode > 0 and .opponent.opponentAllyCode > 0 and (.opponent.format == "3v3" or .opponent.format == "5v5")' smoke-results/current-gac.json > /dev/null
              if jq -e '.scouting != null' smoke-results/current-gac.json > /dev/null; then
                jq -e '.scouting.format == .opponent.format' smoke-results/current-gac.json > /dev/null
              fi
              ;;
            202)
              jq -e '.status == "Pending" and (.message | type == "string" and length > 0)' smoke-results/current-gac.json > /dev/null
              ;;
            404|409)
              jq -e '.status | type == "string" and length > 0' smoke-results/current-gac.json > /dev/null
              ;;
            *)
              echo "Unexpected current GAC scouting status: ${current_gac_status}"
              cat smoke-results/current-gac.json
              exit 1
              ;;
          esac

          curl --fail-with-body --silent --show-error --request POST "${base_url}/refresh" --output smoke-results/refresh.json

          refresh_rate_limit_status=$(curl --silent --show-error \
            --request POST "${base_url}/refresh" \
            --dump-header smoke-results/refresh-rate-limit-headers.txt \
            --output smoke-results/refresh-rate-limit.json \
            --write-out '%{http_code}')
          test "${refresh_rate_limit_status}" = "429"
          grep -qi '^retry-after:' smoke-results/refresh-rate-limit-headers.txt

          curl --fail-with-body --silent --show-error "${base_url}" --output smoke-results/player.json
          curl --fail-with-body --silent --show-error "${base_url}/roster?page=1&pageSize=10&orderBy=GalacticPower&direction=Descending" --output smoke-results/roster.json
          curl --fail-with-body --silent --show-error "${base_url}/analysis" --output smoke-results/analysis.json
          curl --fail-with-body --silent --show-error "${base_url}/history?limit=5" --output smoke-results/history.json
          curl --fail-with-body --silent --show-error "${base_url}/gl-progress" --output smoke-results/gl-progress.json

          mapfile -t character_ids < <(jq -r '[.roster[] | select(.isShip == false)][0:5][].definitionId' smoke-results/player.json)
          test "${#character_ids[@]}" -eq 5
          jq -n \
            --arg leader "${character_ids[0]}" \
            --arg member1 "${character_ids[1]}" \
            --arg member2 "${character_ids[2]}" \
            --arg member3 "${character_ids[3]}" \
            --arg member4 "${character_ids[4]}" \
            '{
              name: "Smoke 5v5",
              format: "5v5",
              use: "Flexible",
              tags: ["smoke", "gac"],
              variants: [{
                key: "default",
                name: "Principal",
                leaderDefinitionId: $leader,
                memberDefinitionIds: [$member1, $member2, $member3, $member4]
              }]
            }' > smoke-results/squad-request.json

          curl --fail-with-body --silent --show-error \
            --request POST "${api_root}/api/v1/squads" \
            --header 'Content-Type: application/json' \
            --data @smoke-results/squad-request.json \
            --output smoke-results/squad.json
          squad_id=$(jq -r '.id' smoke-results/squad.json)
          test -n "${squad_id}"
          test "${squad_id}" != "null"
          curl --fail-with-body --silent --show-error \
            "${api_root}/api/v1/squads/${squad_id}" \
            --output smoke-results/squad-get.json
          curl --fail-with-body --silent --show-error \
            "${api_root}/api/v1/squads?format=5v5&use=Flexible&tag=smoke&search=Smoke&limit=10" \
            --output smoke-results/squad-search.json

          jq -n \
            --arg leader "${character_ids[0]}" \
            --arg member1 "${character_ids[1]}" \
            --arg member2 "${character_ids[2]}" \
            --arg member3 "${character_ids[3]}" \
            --arg member4 "${character_ids[4]}" \
            '{
              rounds: [{
                season: 999,
                eventNumber: 1,
                roundNumber: 1,
                format: "5v5",
                league: "Aurodium",
                startedAtUtc: "2026-09-01T18:00:00Z",
                fullClear: true,
                source: "smoke",
                defenses: [{
                  zone: "front-top",
                  squad: {
                    leaderDefinitionId: $leader,
                    memberDefinitionIds: [$member1, $member2, $member3, $member4],
                    isFleet: false
                  },
                  holds: 1,
                  defeated: true
                }],
                offenseBattles: [{
                  zone: "front-bottom",
                  defender: {
                    leaderDefinitionId: $leader,
                    memberDefinitionIds: [$member1, $member2, $member3, $member4],
                    isFleet: false
                  },
                  attacker: {
                    leaderDefinitionId: $leader,
                    memberDefinitionIds: [$member1, $member2, $member3, $member4],
                    isFleet: false
                  },
                  won: true,
                  banners: 65,
                  attempt: 1,
                  attackedAtUtc: "2026-09-01T19:00:00Z"
                }]
              }]
            }' > smoke-results/gac-history-request.json

          curl --fail-with-body --silent --show-error \
            --request POST "${gac_opponent_url}/history" \
            --header 'Content-Type: application/json' \
            --data @smoke-results/gac-history-request.json \
            --output smoke-results/gac-history-import.json
          curl --fail-with-body --silent --show-error \
            "${gac_opponent_url}/history?format=5v5&maxRounds=10" \
            --output smoke-results/gac-history.json
          curl --fail-with-body --silent --show-error \
            "${gac_opponent_url}/scouting?format=5v5&targetLeague=Kyber&maxRounds=10" \
            --output smoke-results/gac-scouting.json

          jq -e '.league == "Kyber" and .format == "5v5" and .squadDefenseCount == 11 and .fleetDefenseCount == 3' smoke-results/gac-requirements.json > /dev/null
          jq -e '.fromLeague == "Aurodium" and .toLeague == "Kyber" and .format == "3v3" and .fromSquadDefenseCount == 13 and .toSquadDefenseCount == 15 and .additionalSquadDefenses == 2 and .additionalFleetDefenses == 1 and .isPromotion == true' smoke-results/gac-transition.json > /dev/null
          jq -e '.name | length > 0' smoke-results/player.json > /dev/null
          jq -e '.rosterCount > 0' smoke-results/player.json > /dev/null
          jq -e '.galacticPower > 0' smoke-results/player.json > /dev/null
          jq -e '(.roster | length) == .rosterCount' smoke-results/player.json > /dev/null
          jq -e '.total > 0 and .page == 1 and .pageSize == 10 and (.items | length) > 0 and (.items | length) <= 10' smoke-results/roster.json > /dev/null
          jq -e '.items[0].name | type == "string" and length > 0' smoke-results/roster.json > /dev/null
          jq -e '.items[0].nameKey | type == "string" and length > 0' smoke-results/roster.json > /dev/null
          jq -e '.items[0].thumbnailName | type == "string" and length > 0' smoke-results/roster.json > /dev/null
          jq -e '.items[0].tags | type == "array" and length > 0' smoke-results/roster.json > /dev/null
          jq -e '.galacticPower > 0' smoke-results/analysis.json > /dev/null
          jq -e '.omicrons > 0' smoke-results/analysis.json > /dev/null
          jq -e 'type == "array" and length > 0' smoke-results/history.json > /dev/null
          jq -e 'type == "array"' smoke-results/gl-progress.json > /dev/null
          jq -e '.format == "5v5" and .use == "Flexible" and (.tags | index("smoke")) != null' smoke-results/squad.json > /dev/null
          jq -e '(.variants | length) == 1 and ((.variants[0].leader.name | type) == "string") and ((.variants[0].leader.name | length) > 0)' smoke-results/squad.json > /dev/null
          jq -e '.variants[0].members | length == 4' smoke-results/squad.json > /dev/null
          jq -e --arg id "${squad_id}" '.id == $id' smoke-results/squad-get.json > /dev/null
          jq -e 'type == "array" and length == 1 and .[0].id == $id' --arg id "${squad_id}" smoke-results/squad-search.json > /dev/null
          jq -e '.importedRounds == 1' smoke-results/gac-history-import.json > /dev/null
          jq -e 'type == "array" and length == 1 and .[0].format == "5v5" and .[0].league == "Aurodium"' smoke-results/gac-history.json > /dev/null
          jq -e '.format == "5v5" and .roundsAnalyzed == 1 and .latestObservedLeague == "Aurodium" and .targetLeague == "Kyber"' smoke-results/gac-scouting.json > /dev/null
          jq -e '.requiredSquadDefenses == 11 and .requiredFleetDefenses == 3 and .additionalUnobservedSquadSlots == 2 and .additionalUnobservedFleetSlots == 1' smoke-results/gac-scouting.json > /dev/null
          jq -e '.fullClearRate == 100 and .averageFirstAttackDelayMinutes == 60' smoke-results/gac-scouting.json > /dev/null
          jq -e '.defensePatterns | length == 1 and .[0].squadDefinitionName == "Smoke 5v5" and .[0].variantName == "Principal" and .[0].holdRate == 100' smoke-results/gac-scouting.json > /dev/null
          jq -e '.counterPatterns | length == 1 and .[0].uses == 1 and .[0].wins == 1 and .[0].oneShots == 1 and .[0].winRate == 100' smoke-results/gac-scouting.json > /dev/null
          jq -e '.predictedSquadDefenses | length == 1 and .[0].squadDefinitionName == "Smoke 5v5" and .[0].probability == 100' smoke-results/gac-scouting.json > /dev/null

          curl --fail-with-body --silent --show-error \
            --request DELETE "${api_root}/api/v1/squads/${squad_id}" \
            --output /dev/null

          jq '{league, format, squadDefenseCount, fleetDefenseCount}' smoke-results/gac-requirements.json
          jq '{fromLeague, toLeague, format, squadDefenseDelta, fleetDefenseDelta, additionalSquadDefenses, additionalFleetDefenses}' smoke-results/gac-transition.json
          jq '{name, level, galacticPower, rosterCount, guildName, updatedAtUtc}' smoke-results/player.json
          jq '{total, page, pageSize, totalPages, first: .items[0] | {definitionId, name, thumbnailName, factions, tags, galacticPower, relicTier, zetaCount, omicronCount}}' smoke-results/roster.json
          jq '{galacticPower, characterGalacticPower, shipGalacticPower, characterCount, shipCount, relicCharacters, relic7Plus, relic8Plus, relic9Plus, relic10, zetas, omicrons}' smoke-results/analysis.json
          jq '.[0] | {capturedAtUtc, galacticPower, zetas, omicrons}' smoke-results/history.json
          jq '{id, name, format, use, tags, leader: .variants[0].leader.name, members: [.variants[0].members[].name]}' smoke-results/squad.json
          jq '{roundsAnalyzed, latestObservedLeague, targetLeague, requiredSquadDefenses, requiredFleetDefenses, additionalUnobservedSquadSlots, additionalUnobservedFleetSlots, fullClearRate, averageFirstAttackDelayMinutes, defense: .defensePatterns[0] | {leader: .leader.name, squadDefinitionName, variantName, placementRate, averageHolds, holdRate, confidence}, counter: .counterPatterns[0] | {defenderLeader: .defenderLeader.name, attackerLeader: .attackerLeader.name, uses, wins, winRate, oneShots, oneShotRate, averageBanners}}' smoke-results/gac-scouting.json
          if [[ "${current_gac_status}" = "200" ]]; then
            jq '{opponent: .opponent | {opponentAllyCode, opponentName, league, format, roundNumber, formatSource, opponentResolutionMethod}, scoutingFormat: .scouting.format}' smoke-results/current-gac.json
          else
            jq '{status, message}' smoke-results/current-gac.json
          fi

      - name: Upload live smoke responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swgoh-live-smoke-${{ github.run_number }}
          path: smoke-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Dump live dependency logs on failure
        if: failure()
        run: |
          docker logs comlink || true
          docker logs swgoh-stats || true
          docker logs mongodb || true
          cat smoke-results/api.log || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f comlink swgoh-stats mongodb 2>/dev/null || true
          docker network rm swgoh-smoke 2>/dev/null || true
